<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrinterStatsNoti — ระบบติดตามและแจ้งเตือนเครื่องปริ้น</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans Thai', 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <!-- Top Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm">
          <i data-lucide="printer" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">PrinterStatsNoti</h1>
          <p class="text-xs text-slate-500">SNMP Monitor & LINE Alert System</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <button id="btn-poll-now" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          <span class="hidden sm:inline">เช็คสถานะทันที</span>
        </button>
        <button id="btn-add-printer" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>เพิ่มเครื่องปริ้น</span>
        </button>
        <button id="btn-open-settings" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium border border-slate-200 hover:bg-slate-100 text-slate-700 transition">
          <i data-lucide="settings" class="w-4 h-4"></i>
          <span class="hidden sm:inline">ตั้งค่า LINE</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <!-- Summary Strip -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <p class="text-xs font-medium text-slate-500">เครื่องปริ้นทั้งหมด</p>
        <p id="stat-total" class="text-2xl font-bold text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <p class="text-xs font-medium text-slate-500">พร้อมใช้งาน (Online)</p>
        <p id="stat-online" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <p class="text-xs font-medium text-slate-500">แจ้งเตือน / มีปัญหา</p>
        <p id="stat-issues" class="text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <p class="text-xs font-medium text-slate-500">ยอดพิมพ์วันนี้ (หน้า)</p>
        <p id="stat-pages-today" class="text-2xl font-bold text-indigo-600 mt-1">0</p>
      </div>
    </section>

    <!-- Printers Grid -->
    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-semibold text-slate-800">สถานะเครื่องปริ้น (Printers)</h2>
        <span id="last-updated" class="text-xs text-slate-400">กำลังโหลด...</span>
      </div>
      <div id="printers-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></div>
    </section>

    <!-- Alert History -->
    <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="bell" class="w-4 h-4 text-indigo-600"></i>
          <h2 class="text-base font-semibold text-slate-800">ประวัติการแจ้งเตือนเข้ามือถือ (LINE Alerts)</h2>
        </div>
        <button id="btn-daily-report" class="text-xs font-medium text-indigo-600 hover:text-indigo-800">
          ส่งรายงานประจำวันทันที
        </button>
      </div>
      <div id="alerts-list" class="divide-y divide-slate-100 max-h-80 overflow-y-auto"></div>
    </section>
  </main>

  <!-- Add/Edit Printer Modal -->
  <div id="printer-modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 id="printer-modal-title" class="text-lg font-bold text-slate-900">เพิ่มเครื่องปริ้น</h3>
        <button type="button" onclick="closePrinterModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="printer-form" class="space-y-3">
        <input type="hidden" id="printer-id" />
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">ชื่อเครื่องปริ้น</label>
          <input id="printer-name" type="text" required placeholder="เช่น ห้องบัญชี HP M454" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label class="block text-xs font-medium text-slate-700 mb-1">IP Address</label>
            <input id="printer-ip" type="text" required placeholder="192.168.1.50" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">SNMP Port</label>
            <input id="printer-port" type="number" value="161" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">SNMP Community</label>
          <input id="printer-community" type="text" value="public" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
        <div class="pt-1 flex items-center gap-2">
          <input id="printer-simulator" type="checkbox" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
          <label for="printer-simulator" class="text-sm text-slate-700">เปิดโหมดจำลอง (Simulator Mode สำหรับทดสอบ)</label>
        </div>
        <div id="simulator-scenario-wrap" class="hidden">
          <label class="block text-xs font-medium text-slate-700 mb-1">สถานการณ์จำลอง</label>
          <select id="printer-scenario" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="normal">ปกติ (Normal)</option>
            <option value="low_ink">หมึกใกล้หมด (Low Ink)</option>
            <option value="paper_jam">กระดาษติด (Paper Jam)</option>
            <option value="offline">หลุดการเชื่อมต่อ (Offline)</option>
          </select>
        </div>
        <div class="pt-3 flex justify-end gap-2">
          <button type="button" onclick="closePrinterModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">ยกเลิก</button>
          <button type="submit" class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-slate-900">ตั้งค่าระบบ & LINE Messaging API</h3>
        <button type="button" onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="settings-form" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">LINE Channel Access Token (เว้นว่างถ้าไม่เปลี่ยน)</label>
          <input id="set-line-token" type="password" placeholder="ใส่ Channel Access Token จาก LINE Developers" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          <p id="token-status-hint" class="text-xs text-slate-400 mt-0.5"></p>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">LINE Channel Secret (สำหรับ Webhook)</label>
          <input id="set-line-secret" type="password" placeholder="ใส่ Channel Secret" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">LINE Target User ID / Group ID</label>
          <input id="set-line-target" type="text" placeholder="Uxxxxxxxx... หรือ Cxxxxxxxx..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">แจ้งเตือนเมื่อหมึกต่ำกว่า (%)</label>
            <input id="set-low-ink" type="number" min="1" max="90" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">เช็คสถานะทุก ๆ (วินาที)</label>
            <input id="set-poll-interval" type="number" min="10" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">เวลารายงานประจำวัน (Cron)</label>
            <input id="set-daily-cron" type="text" placeholder="0 18 * * *" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Cooldown แจ้งเตือนซ้ำ (นาที)</label>
            <input id="set-cooldown" type="number" min="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          </div>
        </div>
        <div class="pt-3 flex items-center justify-between gap-2 border-t border-slate-100">
          <button type="button" id="btn-test-line" class="px-3.5 py-2 rounded-lg text-sm font-medium bg-emerald-600 hover:bg-emerald-700 text-white">
            ทดสอบส่ง LINE
          </button>
          <div class="flex gap-2">
            <button type="button" onclick="closeSettingsModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">ยกเลิก</button>
            <button type="submit" class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white">บันทึกการตั้งค่า</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
